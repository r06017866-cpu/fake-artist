<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1736">
<title>Fake Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1736; --bg2: #2a2350; --card: #2f2858; --line: #463d7a;
    --text: #f5f3ff; --muted: #b5addc; --accent: #ffbe0b; --accent-ink: #2a1d00;
    --good: #06d6a0; --bad: #ff4d6d; --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    font-family: "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 20% 0%, #3b2f7a 0%, var(--bg) 55%) fixed;
    color: var(--text); font-size: 17px; line-height: 1.35;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }
  h1 { font-size: 46px; line-height: 1; margin: 18px 0 4px; letter-spacing: -1px; }
  h1 .fake { color: var(--accent); display: inline-block; transform: rotate(-4deg); }
  h2 { font-size: 24px; margin: 4px 0 10px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
  input, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg2);
    border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 110px; font-size: 15px; resize: vertical; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 13px 18px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%;
    box-shadow: 0 4px 0 #c48f00; transition: transform .05s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c48f00; }
  button.secondary { background: var(--bg2); color: var(--text); box-shadow: 0 4px 0 #120f26; border: 2px solid var(--line); }
  button.ghost { background: transparent; color: var(--muted); box-shadow: none; border: 0; padding: 8px; width: auto; text-decoration: underline; }
  button:disabled { opacity: .45; pointer-events: none; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .stack > * + * { margin-top: 10px; }
  .divider { text-align: center; color: var(--muted); margin: 14px 0; font-size: 14px; }
  .code { font-size: 54px; font-weight: 800; letter-spacing: 10px; color: var(--accent); text-align: center; line-height: 1; margin: 6px 0; }
  .players { list-style: none; padding: 0; margin: 0; }
  .players li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .players li:last-child { border-bottom: 0; }
  .dot { display: inline-block; vertical-align: middle; width: 18px; height: 18px; border-radius: 50%; flex: none; border: 2px solid rgba(255,255,255,.6); }
  .grow { flex: 1; }
  .tag { font-size: 13px; padding: 1px 8px; border-radius: 99px; background: var(--bg2); color: var(--muted); }
  .tag.you { background: var(--accent); color: var(--accent-ink); }
  .offline { opacity: .45; }
  .x { width: auto; padding: 2px 10px; background: transparent; color: var(--muted); box-shadow: none; font-size: 20px; }

  /* Geheimkarte */
  .secret {
    user-select: none; -webkit-user-select: none; touch-action: none;
    min-height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    border-radius: 22px; padding: 20px; background: repeating-linear-gradient(45deg, #3a3170, #3a3170 14px, #342c66 14px, #342c66 28px);
    border: 2px dashed var(--line); cursor: pointer;
  }
  .secret.open { background: #fffdf5; color: #1b1736; border: 2px solid var(--accent); }
  .secret.open.fake { background: var(--bad); color: #fff; }
  .secret .big { font-size: 40px; font-weight: 800; line-height: 1.05; }
  .secret .label { font-size: 15px; opacity: .75; }

  /* Zeichenfläche */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 15px; white-space: nowrap; }
  .chip b { color: var(--accent); }
  .peek { user-select: none; -webkit-user-select: none; cursor: pointer; }
  #canvasWrap { position: relative; }
  canvas { display: block; width: 100%; aspect-ratio: 1 / 1; background: #fffdf5; border-radius: 18px; touch-action: none; box-shadow: 0 6px 0 #120f26; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas.myturn { outline: 4px solid var(--accent); outline-offset: 3px; }
  .turnbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 6px; }
  .turnbar > span { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--card); font-size: 14px; border: 2px solid transparent; }
  .turnbar > span.now { border-color: var(--accent); }
  .banner { text-align: center; padding: 10px; border-radius: 14px; background: var(--card); margin: 10px 0; font-weight: 700; }
  .banner.go { background: var(--accent); color: var(--accent-ink); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.02); } }

  .votebtn { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--bg2); color: var(--text); box-shadow: 0 4px 0 #120f26; border: 2px solid var(--line); }
  .votebtn.sel { border-color: var(--accent); background: #4a3e10; }
  .result-head { text-align: center; font-size: 30px; font-weight: 800; line-height: 1.1; margin: 8px 0; }
  .result-head.win { color: var(--good); }
  .result-head.lose { color: var(--bad); }
  .score { font-weight: 800; color: var(--accent); }
  .plus { color: var(--good); font-weight: 700; font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: #1b1736; padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: 0 8px 30px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; z-index: 10; }
  #toast.show { opacity: 1; }
  details summary { cursor: pointer; font-weight: 700; }
  details ol { padding-left: 20px; margin: 8px 0 0; }
  .conn { position: fixed; top: 0; left: 0; right: 0; background: var(--bad); color: #fff; text-align: center; font-size: 14px; padding: 4px; display: none; z-index: 9; }
</style>
</head>
<body>
<div class="conn" id="conn">Verbindung weg… verbinde neu</div>
<div id="app"></div>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ================= Grundlagen =================
const socket = io();
const $app = document.getElementById("app");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let pid = store.get("fa_pid");
if (!pid) { pid = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("fa_pid", pid); }

let S = null;             // aktueller Spielzustand vom Server
let lastScreen = "";      // um unnötiges Neu-Rendern zu vermeiden
let live = null;          // Strich, der gerade von jemand anderem gezeichnet wird
let drawing = null;       // mein eigener Strich in Arbeit
let strokeSentTurn = -1;  // in welchem Zug ich schon gezeichnet habe
let customOpen = false;   // Box "Eigene Begriffe" offen lassen

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const player = (id) => S && S.players.find((p) => p.id === id);
const pname = (id) => (player(id) ? esc(player(id).name) : "?");
const dot = (color) => `<span class="dot" style="background:${color}"></span>`;
const isHost = () => S && S.hostId === S.me;

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

// ================= Verbindung =================
socket.on("connect", () => {
  document.getElementById("conn").style.display = "none";
  const room = store.get("fa_room");
  if (room) socket.emit("join", { code: room, name: store.get("fa_name"), playerId: pid });
});
socket.on("disconnect", () => { document.getElementById("conn").style.display = "block"; });
socket.on("toast", (msg) => {
  toast(msg);
  if (/gibt es nicht/.test(msg)) { store.set("fa_room", null); if (!S) render(); }
});
socket.on("kicked", (msg) => { store.set("fa_room", null); S = null; toast(msg); render(true); });

socket.on("state", (state) => {
  const prevTurn = S && S.round ? S.round.turn : null;
  const prevPhase = S ? S.phase : null;
  S = state;
  store.set("fa_room", S.code);
  if (!S.round || S.round.turn !== prevTurn || S.phase !== prevPhase) live = null;
  if (S.phase === "draw" && S.round.currentPlayer === S.me && prevTurn !== S.round.turn) {
    try { navigator.vibrate && navigator.vibrate(120); } catch {}
  }
  render();
});

socket.on("stroke:live", ({ playerId, color, points }) => {
  if (!live || live.playerId !== playerId) live = { playerId, color, points: [] };
  live.points.push(...points);
  redraw();
});
socket.on("stroke:cancel", () => { live = null; redraw(); });

// ================= Rendering =================
function render(force) {
  const screen = !S ? "home" : S.phase;
  // Zeichen-Bildschirm nur einmal aufbauen, danach nur Teile aktualisieren (sonst flackert die Leinwand)
  if (!force && screen === lastScreen && (screen === "draw")) { updateDraw(); return; }
  // Was gerade getippt wird, beim Neu-Aufbau behalten
  const a = document.activeElement;
  const keep = a && a.id && /^(INPUT|TEXTAREA)$/.test(a.tagName) && screen === lastScreen
    ? { id: a.id, value: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  lastScreen = screen;
  ({ home: viewHome, lobby: viewLobby, reveal: viewReveal, draw: viewDraw, vote: viewVote, guess: viewGuess, result: viewResult })[screen]();
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.value = keep.value; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch {} }
  }
}

// ---------- Startseite ----------
function viewHome() {
  const params = new URLSearchParams(location.search);
  const codeFromLink = (params.get("r") || "").toUpperCase().slice(0, 4);
  $app.innerHTML = `
    <h1>Fake <span class="fake">Artist</span></h1>
    <p class="muted">Alle zeichnen gemeinsam ein geheimes Wort – nur einer kennt es nicht.</p>
    <div class="card stack">
      <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="nickname" value="${esc(store.get("fa_name") || "")}">
      ${codeFromLink ? "" : `<button id="create">Neuen Raum erstellen</button><div class="divider">oder einem Raum beitreten</div>`}
      <div class="row">
        <input id="code" maxlength="4" placeholder="CODE" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:800" value="${esc(codeFromLink)}">
        <button id="join" class="${codeFromLink ? "" : "secondary"}">Beitreten</button>
      </div>
    </div>
    <div class="card">
      <details ${codeFromLink ? "" : "open"}>
        <summary>So geht's</summary>
        <ol class="small">
          <li>Alle sehen die <b>Kategorie</b> und das <b>geheime Wort</b> – ausser dem <b>Fake</b>.</li>
          <li>Reihum zeichnet jeder <b>einen einzigen Strich</b> (Finger nicht absetzen). Zwei Runden.</li>
          <li>Zeichne so, dass die anderen merken, dass du das Wort kennst – aber nicht so deutlich, dass der Fake es errät.</li>
          <li>Dann stimmt ihr ab: <b>Wer ist der Fake?</b></li>
          <li>Wird der Fake erwischt, darf er das Wort raten. Richtig geraten = er gewinnt trotzdem.</li>
        </ol>
        <p class="small muted">Punkte: Fake gewinnt → +2 für den Fake. Fake verliert → +1 für alle anderen. Ab 3 Spielern, am besten 4–8.</p>
      </details>
    </div>
    <p style="text-align:center" class="small"><a href="/umfrage" style="color:var(--accent)">📊 Umfrage erstellen</a></p>`;
  const nameEl = document.getElementById("name"), codeEl = document.getElementById("code");
  const go = (ev, extra) => {
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return toast("Bitte gib zuerst deinen Namen ein."); }
    store.set("fa_name", name);
    socket.emit(ev, { name, playerId: pid, ...extra });
  };
  const btnCreate = document.getElementById("create");
  if (btnCreate) btnCreate.onclick = () => go("create");
  document.getElementById("join").onclick = () => {
    const code = codeEl.value.trim().toUpperCase();
    if (code.length !== 4) return toast("Der Code hat 4 Buchstaben.");
    go("join", { code });
  };
  codeEl.oninput = () => (codeEl.value = codeEl.value.toUpperCase().replace(/[^A-Z]/g, ""));
  nameEl.onkeydown = (e) => { if (e.key === "Enter") (codeFromLink ? document.getElementById("join") : btnCreate).click(); };
  codeEl.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("join").click(); };
  if (codeFromLink && !nameEl.value) nameEl.focus();
}

function leave() {
  socket.emit("leave");
  store.set("fa_room", null); S = null;
  history.replaceState(null, "", location.pathname);
  render(true);
}

function playerList(opts = {}) {
  const sorted = opts.byScore ? [...S.players].sort((a, b) => b.score - a.score) : S.players;
  return `<ul class="players">${sorted.map((p) => `
    <li class="${p.connected ? "" : "offline"}">
      ${dot(p.color)}
      <span class="grow">${esc(p.name)} ${p.id === S.me ? '<span class="tag you">du</span>' : ""} ${p.id === S.hostId ? '<span class="tag">👑 Host</span>' : ""} ${p.connected ? "" : '<span class="tag">offline</span>'}</span>
      ${opts.delta && opts.delta[p.id] ? `<span class="plus">+${opts.delta[p.id]}</span>` : ""}
      ${opts.scores ? `<span class="score">${p.score}</span>` : ""}
      ${opts.kick && isHost() && p.id !== S.me ? `<button class="x" data-kick="${esc(p.id)}" title="Entfernen">×</button>` : ""}
    </li>`).join("")}</ul>`;
}

// ---------- Lobby ----------
function viewLobby() {
  const link = location.origin + "/?r=" + S.code;
  const enough = S.players.filter((p) => p.connected).length >= S.minPlayers;
  const hasScores = S.players.some((p) => p.score > 0);
  $app.innerHTML = `
    <div class="card" style="text-align:center">
      <div class="muted small">Raum-Code</div>
      <div class="code">${esc(S.code)}</div>
      <div class="row" style="margin-top:10px">
        <button class="secondary" id="share">🔗 Link teilen</button>
      </div>
    </div>
    <div class="card">
      <h2>Spieler (${S.players.length})</h2>
      ${playerList({ kick: true, scores: hasScores })}
      ${hasScores && isHost() ? `<button class="ghost" id="reset">Punkte zurücksetzen</button>` : ""}
    </div>
    ${isHost() ? `
      <div class="card stack">
        <details id="customBox" ${S.settings.customCount || customOpen ? "open" : ""}>
          <summary>Eigene Begriffe (optional) ${S.settings.customCount ? `· ${S.settings.customCount} drin` : ""}</summary>
          <p class="small muted">Ein Begriff pro Zeile im Format <b>Kategorie: Wort</b>, z.B. <i>Lehrer: Herr Müller</i>. Perfekt für Insider!</p>
          <textarea id="custom" placeholder="Schule: Mensa&#10;Lehrer: Frau Meier&#10;Klasse: Klassenlager">${esc(S.settings.customText)}</textarea>
          <label class="row small" style="justify-content:flex-start;gap:8px;margin-top:8px"><input type="checkbox" id="onlyCustom" style="width:auto" ${S.settings.onlyCustom ? "checked" : ""}> Nur eigene Begriffe verwenden</label>
        </details>
        <button id="start" ${enough ? "" : "disabled"}>${S.roundNo ? "Nächste Runde starten" : "Spiel starten"}</button>
        ${enough ? "" : `<p class="small muted" style="text-align:center">Mindestens ${S.minPlayers} Spieler nötig – teile den Link!</p>`}
      </div>` : `
      <div class="banner">Warte, bis ${pname(S.hostId)} das Spiel startet…</div>`}
    <div style="text-align:center"><button class="ghost" id="leave">Raum verlassen</button></div>`;

  document.getElementById("share").onclick = async () => {
    try {
      if (navigator.share) await navigator.share({ title: "Fake Artist", text: "Komm in meinen Fake-Artist-Raum: " + S.code, url: link });
      else { await navigator.clipboard.writeText(link); toast("Link kopiert!"); }
    } catch { try { await navigator.clipboard.writeText(link); toast("Link kopiert!"); } catch { toast(link); } }
  };
  document.getElementById("leave").onclick = leave;
  $app.querySelectorAll("[data-kick]").forEach((b) => (b.onclick = () => socket.emit("kick", b.dataset.kick)));
  const reset = document.getElementById("reset"); if (reset) reset.onclick = () => socket.emit("resetScores");
  if (isHost()) {
    const ta = document.getElementById("custom"), cb = document.getElementById("onlyCustom");
    const save = () => socket.emit("settings", { customText: ta.value, onlyCustom: cb.checked });
    ta.onchange = save; cb.onchange = save;
    document.getElementById("customBox").ontoggle = (e) => (customOpen = e.target.open);
    document.getElementById("start").onclick = () => { save(); socket.emit("start"); };
  }
}

// ---------- Rolle anschauen ----------
function secretHTML() {
  const r = S.round;
  if (r.spectator) return `<div class="label">Du schaust diese Runde zu</div><div class="big">${esc(r.category)}</div>`;
  if (r.isFake) return `<div class="label">Kategorie: <b>${esc(r.category)}</b></div><div class="big">Du bist der FAKE! 🤫</div><div class="label">Tu so, als wüsstest du das Wort.</div>`;
  return `<div class="label">Kategorie: <b>${esc(r.category)}</b></div><div class="big">${esc(r.word)}</div><div class="label">Psst – nicht zeigen!</div>`;
}

function bindHold(el, openClass, html, closedHTML) {
  const show = (e) => { e.preventDefault(); el.classList.add("open"); if (S.round.isFake) el.classList.add("fake"); el.innerHTML = html(); };
  const hide = () => { el.classList.remove("open", "fake"); el.innerHTML = closedHTML; };
  el.addEventListener("pointerdown", show);
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => el.addEventListener(ev, hide));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

function viewReveal() {
  const r = S.round;
  const iAmReady = r.ready.includes(S.me);
  const inRound = r.order.filter((id) => player(id) && player(id).connected);
  const closed = `<div class="big">👆</div><div>Gedrückt halten, um deine Rolle zu sehen</div><div class="label">Halte das Handy so, dass niemand mitschaut</div>`;
  $app.innerHTML = `
    <h2>Runde ${S.roundNo}</h2>
    <div class="secret" id="secret">${closed}</div>
    ${r.spectator ? `<div class="banner">Du bist mitten in einer Runde dazugekommen – nächste Runde bist du dabei.</div>` : `
      <button id="ready" style="margin-top:14px" ${iAmReady ? "disabled" : ""}>${iAmReady ? "Bereit ✓" : "Ich hab's gesehen – bereit!"}</button>`}
    <p class="muted small" style="text-align:center">${r.ready.length} / ${inRound.length} bereit</p>
    <div class="card small">${inRound.map((id) => `${dot(player(id).color)} ${pname(id)} ${r.ready.includes(id) ? "✓" : "…"}`).join(" &nbsp; ")}</div>`;
  bindHold(document.getElementById("secret"), "open", secretHTML, closed);
  const b = document.getElementById("ready"); if (b) b.onclick = () => socket.emit("ready");
}

// ---------- Zeichnen ----------
let canvas, ctx;

function viewDraw() {
  $app.innerHTML = `
    <div class="topbar">
      <span class="chip">Kategorie: <b>${esc(S.round.category)}</b></span>
      <span class="chip peek" id="peek">👁 Wort</span>
    </div>
    <div id="turnInfo" class="banner"></div>
    <div id="canvasWrap"><canvas id="cv"></canvas></div>
    <div class="turnbar" id="turnbar"></div>
    <div id="hostTools"></div>`;
  const peek = document.getElementById("peek");
  const word = S.round.isFake ? "Du bist der Fake 🤫" : S.round.spectator ? "Zuschauer" : S.round.word;
  const showPeek = (e) => { e.preventDefault(); peek.innerHTML = "<b>" + esc(word) + "</b>"; };
  const hidePeek = () => (peek.textContent = "👁 Wort");
  peek.addEventListener("pointerdown", showPeek);
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => peek.addEventListener(ev, hidePeek));
  setupCanvas(document.getElementById("cv"), true);
  updateDraw();
}

function updateDraw() {
  const r = S.round;
  const mine = r.currentPlayer === S.me;
  const lap = Math.min(2, Math.floor(r.turn / r.order.length) + 1);
  const cur = player(r.currentPlayer);
  document.getElementById("turnInfo").className = "banner" + (mine ? " go" : "");
  document.getElementById("turnInfo").innerHTML = mine
    ? "Du bist dran! Zeichne <u>einen</u> Strich ✏️"
    : `${cur ? dot(cur.color) : ""} <span style="vertical-align:middle">${pname(r.currentPlayer)} zeichnet… <span class="muted small">(Runde ${lap}/2)</span></span>`;
  canvas.classList.toggle("myturn", mine);
  document.getElementById("turnbar").innerHTML = r.order.map((id) => {
    const p = player(id); if (!p) return "";
    return `<span class="${id === r.currentPlayer ? "now" : ""} ${p.connected ? "" : "offline"}">${dot(p.color)}${esc(p.name)}</span>`;
  }).join("");
  document.getElementById("hostTools").innerHTML = isHost() && !mine
    ? `<div style="text-align:center"><button class="ghost" id="skip">Zug von ${pname(r.currentPlayer)} überspringen</button></div>` : "";
  const skip = document.getElementById("skip"); if (skip) skip.onclick = () => socket.emit("skip");
  redraw();
}

function setupCanvas(el, interactive) {
  canvas = el; ctx = canvas.getContext("2d");
  sizeCanvas();
  if (!interactive) return;
  let lastSend = 0, buffer = [];
  const flush = () => { if (buffer.length) { socket.emit("stroke:points", buffer); buffer = []; } lastSend = performance.now(); };
  const pos = (e) => {
    const rect = canvas.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width)), Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height))];
  };
  let activeId = null; // nur der erste Finger zeichnet (kein Handballen, kein zweiter Finger)
  canvas.addEventListener("pointerdown", (e) => {
    if (activeId !== null) return;
    if (!S || S.phase !== "draw" || S.round.currentPlayer !== S.me || strokeSentTurn === S.round.turn) return;
    e.preventDefault();
    activeId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch {}
    const p = pos(e);
    drawing = { color: player(S.me).color, points: [p] };
    buffer = [p]; flush();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drawing || e.pointerId !== activeId) return;
    e.preventDefault();
    let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    if (!evs || !evs.length) evs = [e];
    for (const ev of evs) {
      if (ev.clientX === 0 && ev.clientY === 0) continue; // fehlerhafter Punkt
      const p = pos(ev), last = drawing.points[drawing.points.length - 1];
      const d = Math.hypot(p[0] - last[0], p[1] - last[1]);
      if (d < 0.003) continue;
      if (d > 0.35) continue; // unmöglicher Sprung -> ignorieren
      drawing.points.push(p); buffer.push(p);
    }
    redraw();
    if (performance.now() - lastSend > 45) flush();
  });
  const end = (e) => {
    if (e && e.pointerId !== activeId) return;
    activeId = null;
    if (!drawing) return;
    flush();
    if (drawing.points.length < 2) { drawing = null; socket.emit("stroke:end"); redraw(); return toast("Zu kurz – zeichne einen Strich!"); }
    strokeSentTurn = S.round.turn;
    // Mein Strich bleibt sichtbar, bis der Server ihn bestätigt
    live = { playerId: S.me, color: drawing.color, points: drawing.points };
    drawing = null;
    socket.emit("stroke:end");
  };
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  // iPhone: verhindern, dass die Seite beim Zeichnen scrollt oder zurückfedert
  const stopTouch = (e) => { if (e.cancelable) e.preventDefault(); };
  canvas.addEventListener("touchstart", stopTouch, { passive: false });
  canvas.addEventListener("touchmove", stopTouch, { passive: false });
}

function sizeCanvas() {
  if (!canvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = canvas.clientWidth || 300;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(w * dpr);
  redraw();
}
window.addEventListener("resize", sizeCanvas);

function drawStroke(s, size) {
  const pts = s.points;
  if (!pts || pts.length === 0) return;
  ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
  ctx.lineWidth = size * 0.014; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0] * size, pts[0][1] * size, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); return; }
  ctx.beginPath();
  ctx.moveTo(pts[0][0] * size, pts[0][1] * size);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0] * size, pts[i][1] * size, mx * size, my * size);
  }
  const last = pts[pts.length - 1];
  ctx.lineTo(last[0] * size, last[1] * size);
  ctx.stroke();
}

function redraw() {
  if (!canvas || !document.body.contains(canvas) || !S || !S.round) return;
  const size = canvas.width;
  ctx.clearRect(0, 0, size, size);
  for (const s of S.round.strokes) drawStroke(s, size);
  if (live) drawStroke(live, size);
  if (drawing) drawStroke(drawing, size);
}

// ---------- Abstimmen ----------
function viewVote() {
  const r = S.round;
  const canVote = !r.spectator;
  const voters = r.order.filter((id) => player(id) && player(id).connected);
  $app.innerHTML = `
    <h2>Wer ist der Fake? 🕵️</h2>
    <p class="muted small">Kategorie: <b>${esc(r.category)}</b> · ${r.voted.length}/${voters.length} haben abgestimmt</p>
    <canvas id="cv"></canvas>
    <div class="stack" style="margin-top:16px">
      ${r.order.filter((id) => player(id)).map((id) => {
        const p = player(id), me = id === S.me;
        return `<button class="votebtn ${r.myVote === id ? "sel" : ""}" data-vote="${esc(id)}" ${me || !canVote ? "disabled" : ""}>
          ${dot(p.color)}<span class="grow">${esc(p.name)}${me ? " (du)" : ""}</span>${r.voted.includes(id) ? '<span class="small muted">hat gewählt ✓</span>' : ""}
        </button>`;
      }).join("")}
    </div>
    <p class="small muted" style="text-align:center">${r.isFake ? "Tipp: Stimm für jemand Verdächtigen, um nicht aufzufallen 😉" : "Du kannst deine Stimme ändern, bis alle gewählt haben."}</p>
    ${isHost() && r.voted.length > 0 && r.voted.length < voters.length ? `<div style="text-align:center"><button class="ghost" id="force">Jetzt auswerten (ohne die Fehlenden)</button></div>` : ""}`;
  setupCanvas(document.getElementById("cv"), false);
  $app.querySelectorAll("[data-vote]").forEach((b) => (b.onclick = () => socket.emit("vote", b.dataset.vote)));
  const f = document.getElementById("force"); if (f) f.onclick = () => socket.emit("forceVote");
}

// ---------- Fake rät ----------
function voteSummary() {
  const r = S.round;
  if (!r.votes) return "";
  const tally = {};
  for (const t of Object.values(r.votes)) tally[t] = (tally[t] || 0) + 1;
  return `<ul class="players">${Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([id, n]) => `
    <li>${player(id) ? dot(player(id).color) : ""}<span class="grow">${pname(id)}</span><span class="small muted">${n} Stimme${n > 1 ? "n" : ""}</span></li>`).join("")}</ul>`;
}

function viewGuess() {
  const r = S.round;
  const iAmFake = r.isFake;
  $app.innerHTML = iAmFake ? `
    <h2>Erwischt! 😱</h2>
    <p>Du kannst trotzdem gewinnen: Errate das geheime Wort!</p>
    <p class="muted">Kategorie: <b>${esc(r.category)}</b></p>
    <canvas id="cv"></canvas>
    <div class="row" style="margin-top:14px">
      <input id="guess" maxlength="40" placeholder="Das Wort ist…" autocomplete="off">
    </div>
    <button id="send" style="margin-top:10px">Raten!</button>` : `
    <h2>${pname(r.accused)} wurde angeklagt…</h2>
    <div class="card">${voteSummary()}</div>
    <div class="banner">${pname(r.accused)} war wirklich der Fake! Jetzt darf er/sie noch das Wort raten…</div>
    <canvas id="cv"></canvas>`;
  setupCanvas(document.getElementById("cv"), false);
  if (iAmFake) {
    const g = document.getElementById("guess");
    const send = () => { if (g.value.trim()) socket.emit("guess", g.value.trim()); };
    document.getElementById("send").onclick = send;
    g.onkeydown = (e) => { if (e.key === "Enter") send(); };
    g.focus();
  }
}

// ---------- Ergebnis ----------
function viewResult() {
  const r = S.round, res = r.result;
  const fake = pname(r.fakeId);
  const iWon = res.fakeWins ? r.fakeId === S.me : r.fakeId !== S.me && r.order.includes(S.me);
  let headline, reason;
  if (!res.caught) {
    headline = `${fake} war der Fake – und kam davon! 🎭`;
    reason = res.tie ? "Gleichstand bei der Abstimmung – der Fake entkommt." : r.accused ? `Ihr habt ${pname(r.accused)} beschuldigt.` : "";
  } else if (res.guessCorrect) {
    headline = `Erwischt – aber ${fake} hat das Wort erraten! 🤯`;
    reason = "";
  } else {
    headline = `Fake erwischt! ${fake} war's 🎉`;
    reason = r.guess ? `Geraten: „${esc(r.guess)}“ – leider falsch.` : "";
  }
  $app.innerHTML = `
    <div class="result-head ${iWon ? "win" : "lose"}">${headline}</div>
    <p style="text-align:center" class="muted">${reason}</p>
    <div class="card" style="text-align:center">
      <div class="muted small">Das Wort war</div>
      <div style="font-size:34px;font-weight:800;color:var(--accent);line-height:1.1">${esc(r.word)}</div>
      <div class="muted small">Kategorie: ${esc(r.category)}</div>
      ${r.guess ? `<div class="small" style="margin-top:6px">Rateversuch vom Fake: <b>${esc(r.guess)}</b> ${res.guessCorrect ? "✅" : "❌"}</div>` : ""}
      ${isHost() && r.guess ? `<button class="ghost small" id="override">${res.guessCorrect ? "Doch falsch? Als falsch werten" : "Doch richtig? Als richtig werten"}</button>` : ""}
    </div>
    <canvas id="cv"></canvas>
    ${r.votes ? `<div class="card"><h2>Stimmen</h2>${voteSummary()}
      <p class="small muted">${Object.entries(r.votes).map(([v, t]) => `${pname(v)} → ${pname(t)}`).join(" · ")}</p></div>` : ""}
    <div class="card"><h2>Punkte</h2>${playerList({ byScore: true, scores: true, delta: res.delta })}</div>
    ${isHost() ? `
      <div class="stack">
        <button id="next">Nächste Runde ▶</button>
        <button class="secondary" id="lobby">Zur Lobby (Spieler/Begriffe ändern)</button>
      </div>` : `<div class="banner">Warte auf ${pname(S.hostId)} für die nächste Runde…</div>`}
    <div style="text-align:center"><button class="ghost" id="leave">Raum verlassen</button></div>`;
  setupCanvas(document.getElementById("cv"), false);
  if (isHost()) {
    document.getElementById("next").onclick = () => socket.emit("start");
    document.getElementById("lobby").onclick = () => socket.emit("lobby");
    const o = document.getElementById("override"); if (o) o.onclick = () => socket.emit("overrideGuess", !res.guessCorrect);
  }
  document.getElementById("leave").onclick = leave;
}

render();
</script>
</body>
</html>
