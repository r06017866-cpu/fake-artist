<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c3b66">
<title>Ice Rumble</title>
<!-- For Poki: add <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script> here (game.js detects it automatically) -->
<style>
  /* Arctic arcade: deep sea blue, ice white, sunny yellow buttons. Everything floats over the live canvas. */
  :root {
    --sea: #0c3b66;
    --sea-dark: #06223d;
    --ice: #eaf7ff;
    --ice-2: #bfe3f7;
    --sun: #ffd84a;
    --sun-dark: #d9a800;
    --ink: #0d2840;
    --red: #ff5a4e;
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sea-dark); font-family: var(--font); color: var(--ink); overscroll-behavior: none; touch-action: none; }
  canvas#game { position: fixed; inset: 0; display: block; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); pointer-events: none; }
  .layer > * { pointer-events: auto; }
  .panel { width: min(440px, 100%); max-height: 100%; overflow: auto; background: rgba(234,247,255,.94); border-radius: 26px; padding: 20px;
    box-shadow: 0 8px 0 rgba(6,34,61,.35), 0 30px 60px rgba(0,0,0,.35); border: 3px solid #fff; backdrop-filter: blur(6px); }

  .btn { display: block; width: 100%; font-weight: 900; font-size: 20px; letter-spacing: .5px; padding: 15px 18px; border-radius: 18px;
    background: var(--sun); color: #3a2a00; box-shadow: 0 5px 0 var(--sun-dark); transition: transform .06s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-dark); }
  .btn.big { font-size: 26px; padding: 18px; }
  .btn.blue { background: #3d9be9; color: #fff; box-shadow: 0 5px 0 #1f6fb3; }
  .btn.white { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #a9cbe4; }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(6,34,61,.55); color: #fff; font-weight: 900; padding: 8px 14px; border-radius: 999px; font-size: 18px; backdrop-filter: blur(4px); }
  .round { width: 44px; height: 44px; border-radius: 50%; background: rgba(6,34,61,.55); color: #fff; font-size: 20px; display: grid; place-items: center; backdrop-filter: blur(4px); }

  /* ---------- Menu ---------- */
  #menu { flex-direction: column; gap: 12px; }
  .topbar { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .logo { text-align: center; line-height: .9; margin: 4px 0 2px; }
  .logo h1 { margin: 0; font-size: clamp(46px, 11vw, 74px); font-weight: 900; color: #fff; letter-spacing: 1px; transform: rotate(-3deg);
    text-shadow: 0 4px 0 #3d9be9, 0 8px 0 var(--sea), 0 14px 24px rgba(0,0,0,.35); -webkit-text-stroke: 2px #1f6fb3; }
  .logo h1 span { color: var(--sun); -webkit-text-stroke-color: #b37f00; }
  .menu-card { display: flex; flex-direction: column; gap: 12px; }
  .hello { display: flex; align-items: center; gap: 12px; }
  .hello p { margin: 0; font-weight: 700; font-size: 13px; color: #315a7d; }
  .arenas { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; margin: 0 -4px; }
  .arenas::-webkit-scrollbar { height: 6px; } .arenas::-webkit-scrollbar-thumb { background: #bcd7ec; border-radius: 3px; }
  .arena { flex: 0 0 118px; scroll-snap-align: start; background: #fff; border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 4px 0 #a9cbe4; border: 3px solid transparent; }
  .arena.sel { border-color: #3d9be9; background: #f1f9ff; }
  .arena.locked { opacity: .55; }
  .arena .ai { font-size: 26px; }
  .arena .an { font-weight: 900; font-size: 14px; }
  .arena .ad { font-size: 11px; color: #4a6e8c; text-align: center; line-height: 1.25; min-height: 28px; }
  .who { flex: 1; min-width: 0; }
  .lvl { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
  .lvl b { font-size: 16px; } .lvl span { color: #4a6e8c; font-weight: 700; font-size: 12px; }
  .lvlbar { height: 10px; background: #d6e8f5; border-radius: 6px; overflow: hidden; margin: 3px 0 4px; }
  .lvlbar i { display: block; height: 100%; background: linear-gradient(90deg, #3d9be9, #6fd0ff); border-radius: 6px; }
  #overStats .xp { grid-template-columns: auto 1fr auto; background: #eaf5ff; }
  #overStats .xp i { display: block; height: 10px; background: #d6e8f5; border-radius: 6px; overflow: hidden; }
  #overStats .xp u { display: block; height: 100%; background: #3d9be9; text-decoration: none; }
  #unlockMsg div + div { margin-top: 4px; }
  .skin.ach .sp { font-size: 10px; line-height: 1.2; text-align: center; padding: 0 2px; }
  .note { min-height: 20px; text-align: center; font-weight: 800; color: var(--red); opacity: 0; transition: opacity .2s; font-size: 14px; }
  .note.show { opacity: 1; }
  .hint { text-align: center; font-size: 12px; color: #4a6e8c; font-weight: 700; }

  /* ---------- HUD ---------- */
  #hud { align-items: flex-start; }
  .hudbar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hudbar .mid { color: #fff; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,.4); font-size: 15px; }
  #hudKos.pop { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.6); color: var(--sun); } }
  #warn { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 56px); left: 50%; transform: translateX(-50%) translateY(-10px); background: var(--red); color: #fff; font-weight: 900; padding: 8px 16px; border-radius: 999px; opacity: 0; transition: .2s; white-space: nowrap; box-shadow: 0 4px 0 #b5322a; font-size: 15px; }
  #warn.show { opacity: 1; transform: translateX(-50%); }
  #banner, #count { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); font-weight: 900; color: #fff; font-size: clamp(54px, 14vw, 110px); opacity: 0; pointer-events: none;
    text-shadow: 0 5px 0 #3d9be9, 0 10px 0 var(--sea), 0 16px 30px rgba(0,0,0,.4); -webkit-text-stroke: 2px #1f6fb3; white-space: nowrap; }
  #banner.show { animation: banner .9s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5) rotate(-6deg); } 20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1) rotate(-3deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.2) rotate(-3deg); } }
  #count.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #boostBar { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: 220px; height: 26px; border-radius: 999px; background: rgba(6,34,61,.6); overflow: hidden; color: #fff; font-weight: 900; font-size: 13px; display: grid; place-items: center; letter-spacing: 1px; }
  #boostBar::before { content: ""; position: absolute; inset: 0; width: var(--f, 0%); background: #3d9be9; transition: width .1s; }
  #boostBar.ready::before { background: var(--sun); }
  #boostBar span { position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #boostBtn { position: fixed; right: max(22px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%;
    background: conic-gradient(var(--sun) var(--f, 0%), rgba(255,255,255,.25) 0); display: grid; place-items: center; pointer-events: auto; touch-action: none; }
  #boostBtn i { width: 76px; height: 76px; border-radius: 50%; background: rgba(6,34,61,.8); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 15px; letter-spacing: .5px; }
  #boostBtn.ready i { background: var(--sun); color: #3a2a00; }
  #boostFill { display: none; }

  /* ---------- End screen ---------- */
  #overTitle { margin: 0; text-align: center; font-size: 40px; font-weight: 900; color: var(--ink); }
  #overTitle.win { color: #e0a100; text-shadow: 0 3px 0 #fff3b0; }
  #overSub { text-align: center; margin: 4px 0 14px; font-weight: 700; color: #315a7d; }
  #overStats { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  #overStats div { display: grid; grid-template-columns: 1fr auto 70px; gap: 8px; align-items: center; background: #fff; border-radius: 12px; padding: 10px 12px; font-weight: 800; }
  #overStats em { font-style: normal; text-align: right; color: #4a6e8c; }
  #overStats .tot { grid-template-columns: 1fr auto; background: #fff6cf; font-size: 18px; }
  #unlockMsg { background: #3d9be9; color: #fff; font-weight: 900; text-align: center; padding: 10px; border-radius: 12px; margin-bottom: 12px; animation: pop .5s; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* ---------- Shop / Skins ---------- */
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .head h2 { margin: 0; font-size: 26px; font-weight: 900; }
  .coins { background: #fff6cf; padding: 6px 12px; border-radius: 999px; font-weight: 900; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: #fff; border-radius: 16px; padding: 10px; margin-bottom: 8px; box-shadow: 0 3px 0 #a9cbe4; }
  .row .ri { font-size: 28px; text-align: center; }
  .row b { display: block; }
  .row small { color: #4a6e8c; font-weight: 700; font-size: 12px; }
  .pips { display: flex; gap: 4px; margin-top: 5px; }
  .pips { gap: 3px; } .pips i { width: 12px; height: 8px; border-radius: 4px; background: #d6e8f5; }
  .pips i.on { background: #3d9be9; }
  .buy { background: var(--sun); color: #3a2a00; font-weight: 900; padding: 10px 12px; border-radius: 12px; box-shadow: 0 3px 0 var(--sun-dark); min-width: 74px; }
  .buy:disabled { background: #d6e8f5; color: #7d97ad; box-shadow: none; }
  .skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .skin { background: #fff; border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 3px 0 #a9cbe4; border: 3px solid transparent; }
  .skin.eq { border-color: #3d9be9; }
  .skin.rare { background: linear-gradient(180deg, #fff, #fff3c9); }
  .skin .sn { font-weight: 900; font-size: 13px; }
  .skin .sp { font-size: 12px; font-weight: 800; color: #4a6e8c; }
  .skin.nope { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  #adNote { position: fixed; inset: 0; background: rgba(6,34,61,.6); color: #fff; display: grid; place-items: center; font-weight: 900; z-index: 9; }

  @media (prefers-reduced-motion: reduce) { #banner.show { animation: none; opacity: 1; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Ice Rumble game"></canvas>

<!-- Menu -->
<div id="menu" class="layer">
  <div class="topbar"><span class="pill">🪙 <span data-coins>0</span></span><button class="round" id="muteBtn" aria-label="Sound on/off">🔊</button></div>
  <div class="logo"><h1>ICE <span>RUMBLE</span></h1></div>
  <div class="panel menu-card">
    <div class="hello"><canvas id="menuPeng"></canvas>
      <div class="who"><div class="lvl"><b>Level <span id="lvlNum">1</span></b><span id="lvlText"></span></div><div class="lvlbar"><i id="lvlBar"></i></div><p id="statLine"></p></div></div>
    <button class="btn big" id="playBtn">▶ PLAY</button>
    <div class="arenas" id="arenas"></div>
    <div class="note" id="menuNote"></div>
    <div class="row2"><button class="btn blue" id="shopBtn">⬆ Upgrades</button><button class="btn white" id="skinsBtn">🐧 Skins</button></div>
    <div class="hint">Mouse or WASD to move · Click or Space to boost</div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="layer hidden">
  <div class="hudbar">
    <span class="pill" title="Penguins left">🐧 <span id="hudLeft">10</span></span>
    <span class="mid" id="hudArena"></span>
    <span style="display:flex;gap:8px"><span class="pill" title="Your knockouts">💥 <span id="hudKos">0</span></span><button class="round" id="pauseBtn" aria-label="Pause">⏸</button></span>
  </div>
  <div id="warn"></div>
  <div id="count"></div>
  <div id="banner"></div>
</div>
<div id="boostBar" class="hidden"><span>BOOST</span></div>
<div id="boostBtn" class="hidden" role="button" aria-label="Boost"><i>BOOST</i></div>
<span id="boostFill"></span>

<!-- Pause -->
<div id="pause" class="layer hidden">
  <div class="panel stack"><h2 style="margin:0;text-align:center;font-size:30px">Paused</h2>
    <button class="btn" id="resumeBtn">▶ Resume</button><button class="btn white" id="quitBtn">Quit to menu</button></div>
</div>

<!-- Game over -->
<div id="over" class="layer hidden">
  <div class="panel">
    <h2 id="overTitle"></h2>
    <p id="overSub"></p>
    <div id="overStats"></div>
    <div id="unlockMsg" class="hidden"></div>
    <div class="stack">
      <button class="btn blue hidden" id="doubleBtn">📺 Double coins</button>
      <button class="btn big" id="againBtn">↻ PLAY AGAIN</button>
      <button class="btn white" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<!-- Upgrades -->
<div id="shop" class="layer hidden">
  <div class="panel">
    <div class="head"><h2>Upgrades</h2><span class="coins">🪙 <span data-coins>0</span></span></div>
    <div id="shopList"></div>
    <button class="btn white" data-back>Back</button>
  </div>
</div>

<!-- Skins -->
<div id="skins" class="layer hidden">
  <div class="panel">
    <div class="head"><h2>Skins</h2><span class="coins">🪙 <span data-coins>0</span></span></div>
    <div class="skins" id="skinList"></div>
    <button class="btn white" data-back>Back</button>
  </div>
</div>

<div id="adNote" class="hidden">…</div>
<script src="game.js"></script>
</body>
</html>
