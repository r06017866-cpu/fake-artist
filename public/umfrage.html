<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<title>Umfrage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea; --paper: #ffffff; --ink: #141414; --muted: #6b675f; --line: #141414;
    --accent: #ff5a36; --accent-soft: #ffe1d8; --teal: #14a38b; --soft: #ece7dc;
    --radius: 14px; --shadow: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  body {
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    background-image: radial-gradient(rgba(20,20,20,.07) 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--ink); font-size: 17px; line-height: 1.4; min-height: 100vh;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 44px; line-height: .95; margin: 22px 0 8px; letter-spacing: -2px; font-weight: 800; }
  h1 span { background: var(--accent); color: #fff; padding: 0 8px; border-radius: 8px; display: inline-block; transform: rotate(-2deg); }
  h2 { font-size: 20px; margin: 0 0 10px; letter-spacing: -.5px; }
  .question { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -1px; margin: 18px 0 6px; overflow-wrap: anywhere; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .center { text-align: center; }
  .card { background: var(--paper); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 14px 0; box-shadow: var(--shadow); }
  input[type=text] {
    width: 100%; font: inherit; color: var(--ink); background: var(--paper);
    border: 2px solid var(--line); border-radius: 10px; padding: 11px 13px; outline: none;
  }
  input[type=text]::placeholder { color: #a39e94; }
  input[type=text]:focus { box-shadow: 3px 3px 0 var(--accent); }
  button {
    font: inherit; font-weight: 700; border: 2px solid var(--line); border-radius: 12px; padding: 13px 18px;
    background: var(--accent); color: #fff; cursor: pointer; width: 100%;
    box-shadow: var(--shadow); transition: transform .05s, box-shadow .05s;
  }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  button.secondary { background: var(--paper); color: var(--ink); }
  button.danger { background: var(--ink); color: #fff; }
  button.ghost { background: transparent; color: var(--muted); box-shadow: none; border: 0; padding: 8px; width: auto; text-decoration: underline; }
  button.ghost:active { transform: none; }
  button:disabled { opacity: .4; pointer-events: none; }
  .stack > * + * { margin-top: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .grow { flex: 1; }
  .x { width: 44px; flex: none; padding: 8px 0; background: transparent; color: var(--muted); box-shadow: none; border: 0; font-size: 24px; }
  .x:active { transform: none; box-shadow: none; }

  /* Schalter */
  .toggle { display: flex; align-items: center; gap: 12px; padding: 11px 0; cursor: pointer; border-bottom: 2px dashed var(--soft); }
  .toggle:last-child { border-bottom: 0; }
  .toggle .txt { flex: 1; font-weight: 700; }
  .toggle .txt small { display: block; color: var(--muted); font-size: 14px; font-weight: 400; line-height: 1.25; }
  .toggle input { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 99px; background: var(--soft); border: 2px solid var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); box-sizing: border-box; transition: transform .15s; }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(22px); }

  /* Antworten zum Wählen */
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--paper); color: var(--ink); font-weight: 700; }
  .opt .mark { width: 26px; height: 26px; flex: none; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: 15px; color: #fff; background: var(--paper); }
  .opt.multi .mark { border-radius: 7px; }
  .opt.sel { background: var(--accent-soft); }
  .opt.sel .mark { background: var(--accent); }
  .opt .label { flex: 1; overflow-wrap: anywhere; }

  /* Ergebnisse */
  .res { margin: 14px 0; }
  .res:first-child { margin-top: 2px; }
  .res .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
  .res .top .label { overflow-wrap: anywhere; }
  .res .pct { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { height: 18px; border-radius: 6px; background: var(--soft); border: 2px solid var(--line); overflow: hidden; margin-top: 5px; }
  .bar > div { height: 100%; background: var(--teal); transition: width .5s; border-right: 2px solid var(--line); }
  .bar > div[style="width:0%"] { border-right: 0; }
  .res.mine .bar > div { background: repeating-linear-gradient(-45deg, var(--accent), var(--accent) 6px, #ff7a5c 6px, #ff7a5c 12px); }
  .res.win .top .label::after { content: " 🏆"; }
  .who { font-size: 14px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 99px; background: var(--paper); border: 2px solid var(--line); color: var(--ink); vertical-align: middle; }
  .badge.closed { background: var(--ink); color: #fff; }
  .badge.you { background: var(--accent); color: #fff; }
  .list a { display: flex; justify-content: space-between; gap: 10px; padding: 11px 2px; color: var(--ink); text-decoration: none; border-bottom: 2px dashed var(--soft); font-weight: 600; }
  .list a:last-child { border-bottom: 0; }
  .list a span:first-child { overflow-wrap: anywhere; }
  a { color: var(--ink); font-weight: 700; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 3px; }
  .modal { position: fixed; inset: 0; background: rgba(20,20,20,.45); display: grid; place-items: center; padding: 20px; z-index: 20; }
  .modal .card { max-width: 400px; width: 100%; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: 4px 4px 0 var(--accent); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; z-index: 30; }
  #toast.show { opacity: 1; }
  .spinner { text-align: center; padding: 60px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="app"><div class="spinner">Lädt… <br><span class="small">(Falls der Server geschlafen hat, kann das bis zu einer Minute dauern.)</span></div></div>
<div id="toast"></div>

<script>
// ================= Grundlagen =================
const $app = document.getElementById("app");
const store = {
  get(k, fallback = null) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

// Jedes Gerät bekommt eine zufällige ID – so weiss die Umfrage, wer schon abgestimmt hat (ohne Konto)
let voter = store.get("poll_voter");
if (!voter) { voter = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join(""); store.set("poll_voter", voter); }

const admins = () => store.get("poll_admin", {});
const myPolls = () => store.get("poll_mine", []);
function rememberPoll(id, question, admin) {
  const list = myPolls().filter((p) => p.id !== id);
  list.unshift({ id, question, admin: !!admin, at: Date.now() });
  store.set("poll_mine", list.slice(0, 30));
}
function forgetPoll(id) { store.set("poll_mine", myPolls().filter((p) => p.id !== id)); }

async function api(path, body) {
  const res = await fetch("/api" + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) { const e = new Error(data.error || "Server nicht erreichbar."); e.status = res.status; throw e; }
  return data;
}

async function share(url, text) {
  try {
    if (navigator.share) { await navigator.share({ title: "Umfrage", text, url }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Link kopiert!"); }
  catch { prompt("Link kopieren:", url); }
}

function confirmBox(text, okLabel) {
  return new Promise((resolve) => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="card stack"><p>${esc(text)}</p><button class="danger" id="mOk">${esc(okLabel)}</button><button class="secondary" id="mNo">Abbrechen</button></div>`;
    document.body.appendChild(m);
    m.querySelector("#mOk").onclick = () => { m.remove(); resolve(true); };
    m.querySelector("#mNo").onclick = () => { m.remove(); resolve(false); };
  });
}

// ================= Seiten =================
const pollId = (location.pathname.match(/^\/umfrage\/([a-z0-9]+)/) || [])[1];
// Verwaltungs-Link: /umfrage/ID#a=SCHLÜSSEL
const hashKey = (location.hash.match(/a=([a-z0-9]+)/) || [])[1];
if (pollId && hashKey) {
  const a = admins(); a[pollId] = hashKey; store.set("poll_admin", a);
  history.replaceState(null, "", location.pathname);
}
pollId ? showPoll(pollId) : showCreate();

// ---------- Neue Umfrage ----------
function showCreate() {
  document.title = "Neue Umfrage";
  const mine = myPolls();
  $app.innerHTML = `
    <h1>Neue<br><span>Umfrage</span></h1>
    <p class="muted">Ohne Konto. Link teilen, alle stimmen ab, fertig.</p>
    <div class="card stack">
      <input type="text" id="q" maxlength="200" placeholder="Deine Frage, z.B. Wann treffen wir uns?">
      <div class="small muted" style="margin-top:14px">Antworten</div>
      <div id="opts" class="stack"></div>
    </div>
    <div class="card">
      <label class="toggle"><span class="txt">Mehrere Antworten erlauben<small>Z.B. für «An welchen Tagen kannst du?»</small></span><input type="checkbox" id="multi"></label>
      <label class="toggle"><span class="txt">Namen zeigen<small>Alle sehen, wer was gewählt hat</small></span><input type="checkbox" id="names"></label>
      <label class="toggle"><span class="txt">Ergebnisse erst nach Abstimmen<small>Damit niemand einfach der Mehrheit folgt</small></span><input type="checkbox" id="hide"></label>
    </div>
    <button id="create">Umfrage erstellen</button>
    ${mine.length ? `<div class="card" style="margin-top:22px"><h2>Meine Umfragen</h2><div class="list">${mine.map((p) => `
      <a href="/umfrage/${esc(p.id)}"><span>${esc(p.question)}</span><span class="small muted">${p.admin ? "👑" : ""} ${new Date(p.at).toLocaleDateString("de-CH")}</span></a>`).join("")}</div></div>` : ""}
    <p class="center small muted" style="margin-top:24px"><a href="/">🎨 Fake Artist spielen</a></p>`;

  const box = document.getElementById("opts");
  const addOpt = (value = "") => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<input type="text" class="grow" maxlength="100" placeholder="Antwort ${box.children.length + 1}"><button class="x" title="Entfernen">×</button>`;
    const inp = row.querySelector("input");
    inp.value = value;
    inp.oninput = () => { if (inp === lastInput() && inp.value.trim() && box.children.length < 12) addOpt(); };
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); const all = inputs(); const n = all[all.indexOf(inp) + 1]; n ? n.focus() : document.getElementById("create").click(); } };
    row.querySelector(".x").onclick = () => { if (box.children.length > 2) { row.remove(); renumber(); } else inp.value = ""; };
    box.appendChild(row);
  };
  const inputs = () => [...box.querySelectorAll("input")];
  const lastInput = () => inputs().at(-1);
  const renumber = () => inputs().forEach((i, k) => (i.placeholder = "Antwort " + (k + 1)));
  addOpt(); addOpt(); addOpt();

  document.getElementById("create").onclick = async (e) => {
    const btn = e.currentTarget;
    const question = document.getElementById("q").value.trim();
    const options = inputs().map((i) => i.value.trim()).filter(Boolean);
    if (!question) { document.getElementById("q").focus(); return toast("Bitte gib zuerst eine Frage ein."); }
    if (options.length < 2) return toast("Es braucht mindestens 2 Antworten.");
    btn.disabled = true; btn.textContent = "Wird erstellt…";
    try {
      const r = await api("/polls", {
        question, options,
        multi: document.getElementById("multi").checked,
        names: document.getElementById("names").checked,
        hideResults: document.getElementById("hide").checked,
      });
      const a = admins(); a[r.id] = r.adminKey; store.set("poll_admin", a);
      rememberPoll(r.id, question, true);
      location.href = "/umfrage/" + r.id;
    } catch (err) {
      toast(err.message); btn.disabled = false; btn.textContent = "Umfrage erstellen";
    }
  };
}

// ---------- Umfrage ansehen und abstimmen ----------
let P = null;          // aktuelle Umfrage vom Server
let editing = false;   // Stimme gerade am Ändern?
let picked = [];       // aktuelle Auswahl
let timer = null;

async function load(id) {
  P = await api(`/polls/${id}?voter=${voter}&admin=${admins()[id] || ""}`);
  rememberPoll(P.id, P.question, P.isAdmin);
}

async function showPoll(id) {
  try { await load(id); }
  catch (err) {
    document.title = "Umfrage";
    if (err.status === 404) forgetPoll(id);
    $app.innerHTML = `<h1>Hoppla</h1><p>${esc(err.message)}</p><button onclick="location.href='/umfrage'">Neue Umfrage erstellen</button>`;
    return;
  }
  document.title = P.question;
  picked = P.myVote ? [...P.myVote.choices] : [];
  renderPoll();
  // Ergebnisse alle paar Sekunden aktualisieren
  clearInterval(timer);
  timer = setInterval(async () => {
    if (document.hidden || editingNow()) return;
    try { await load(id); renderPoll(); } catch {}
  }, 5000);
}
const editingNow = () => (!P.myVote || editing) && !P.closed && (picked.length > 0 || (document.activeElement && document.activeElement.id === "name"));

function renderPoll() {
  const showVoting = !P.closed && (!P.myVote || editing);
  const link = location.origin + "/umfrage/" + P.id;
  const n = P.voterCount;
  $app.innerHTML = `
    <div class="question">${esc(P.question)}</div>
    <p class="muted small">
      ${n} ${n === 1 ? "Person hat" : "Personen haben"} abgestimmt
      ${P.multi ? " · Mehrfachauswahl" : ""}
      ${P.closed ? ' <span class="badge closed">Geschlossen</span>' : ""}
      ${P.isAdmin ? ' <span class="badge">👑 deine Umfrage</span>' : ""}
    </p>
    ${showVoting ? votingHTML() : resultsHTML()}
    <div class="stack" style="margin-top:18px">
      <button class="secondary" id="share">🔗 Link teilen</button>
      ${P.myVote && !P.closed && !editing ? `<button class="secondary" id="change">✏️ Stimme ändern</button>` : ""}
    </div>
    ${P.isAdmin ? adminHTML() : ""}
    <p class="center small muted" style="margin-top:24px"><a href="/umfrage">+ Eigene Umfrage erstellen</a></p>`;

  document.getElementById("share").onclick = () => share(link, P.question);
  const ch = document.getElementById("change");
  if (ch) ch.onclick = () => { editing = true; picked = [...P.myVote.choices]; renderPoll(); };
  if (showVoting) bindVoting();
  if (P.isAdmin) bindAdmin();
}

function votingHTML() {
  const name = (P.myVote && P.myVote.name) || store.get("poll_name", "");
  return `
    <p class="small muted">${P.multi ? "Wähle eine oder mehrere Antworten:" : "Wähle eine Antwort:"}</p>
    <div class="stack" id="opts">
      ${P.options.map((o, i) => `
        <button class="opt ${P.multi ? "multi" : ""} ${picked.includes(i) ? "sel" : ""}" data-i="${i}">
          <span class="mark">${picked.includes(i) ? "✓" : ""}</span><span class="label">${esc(o)}</span>
        </button>`).join("")}
    </div>
    ${P.names ? `<input type="text" id="name" maxlength="30" placeholder="Dein Name (alle sehen ihn)" value="${esc(name)}" style="margin-top:14px">` : ""}
    <button id="vote" style="margin-top:14px" ${picked.length ? "" : "disabled"}>${P.myVote ? "Stimme speichern" : "Abstimmen"}</button>
    ${P.myVote ? `<div class="center"><button class="ghost" id="cancel">Abbrechen</button> <button class="ghost" id="remove">Stimme zurückziehen</button></div>` : ""}
    ${P.hideResults && !P.results ? `<p class="center small muted">Die Ergebnisse siehst du nach deiner Stimme.</p>` : ""}`;
}

function bindVoting() {
  document.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
    const i = Number(b.dataset.i);
    if (P.multi) picked = picked.includes(i) ? picked.filter((x) => x !== i) : [...picked, i];
    else picked = picked.includes(i) ? [] : [i];
    const nameEl = document.getElementById("name");
    const nameVal = nameEl ? nameEl.value : null;
    renderPoll();
    if (nameEl && nameVal != null) document.getElementById("name").value = nameVal;
  }));
  const send = async (choices) => {
    const nameEl = document.getElementById("name");
    const name = nameEl ? nameEl.value.trim() : "";
    if (P.names && choices.length && !name) { nameEl.focus(); return toast("Bitte gib deinen Namen ein."); }
    if (name) store.set("poll_name", name);
    const btn = document.getElementById("vote"); btn.disabled = true;
    try {
      P = await api(`/polls/${P.id}/vote`, { voter, name, choices, admin: admins()[P.id] });
      editing = false; picked = P.myVote ? [...P.myVote.choices] : [];
      renderPoll();
      toast(choices.length ? "Stimme gespeichert ✓" : "Stimme zurückgezogen");
    } catch (err) { toast(err.message); btn.disabled = false; }
  };
  document.getElementById("vote").onclick = () => send(picked);
  const c = document.getElementById("cancel"); if (c) c.onclick = () => { editing = false; picked = [...P.myVote.choices]; renderPoll(); };
  const r = document.getElementById("remove"); if (r) r.onclick = () => send([]);
}

function resultsHTML() {
  if (!P.results) return `<div class="card center muted">Die Ergebnisse werden nach deiner Stimme angezeigt.</div>`;
  const { counts, who } = P.results;
  const base = P.multi ? Math.max(1, P.voterCount) : Math.max(1, counts.reduce((a, b) => a + b, 0));
  const max = Math.max(...counts);
  const mine = P.myVote ? P.myVote.choices : [];
  const order = P.options.map((_, i) => i);
  if (P.closed) order.sort((a, b) => counts[b] - counts[a]);
  return `<div class="card">
    ${order.map((i) => {
      const pct = Math.round((counts[i] / base) * 100);
      return `<div class="res ${mine.includes(i) ? "mine" : ""} ${P.closed && max > 0 && counts[i] === max ? "win" : ""}">
        <div class="top"><span class="label">${esc(P.options[i])} ${mine.includes(i) ? '<span class="badge you">deine Wahl</span>' : ""}</span>
          <span class="pct">${counts[i]} · ${pct}%</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        ${who && who[i].length ? `<div class="who">${who[i].map(esc).join(", ")}</div>` : ""}
      </div>`;
    }).join("")}
    ${P.multi ? `<p class="small muted">Prozent = Anteil der Personen, die diese Antwort gewählt haben.</p>` : ""}
    ${!P.closed ? `<p class="small muted center">Aktualisiert sich automatisch.</p>` : ""}
  </div>`;
}

function adminHTML() {
  return `<div class="card stack" style="margin-top:22px">
    <h2>Verwaltung</h2>
    <p class="small muted">Nur du siehst diesen Bereich. Mit dem Verwaltungs-Link kannst du die Umfrage auch auf einem anderen Gerät verwalten. Teile ihn nicht!</p>
    <button class="secondary" id="toggleClose">${P.closed ? "🔓 Umfrage wieder öffnen" : "🔒 Umfrage schliessen"}</button>
    <button class="secondary" id="adminLink">🔑 Verwaltungs-Link kopieren</button>
    <button class="ghost" id="del" style="color:var(--bad)">Umfrage löschen</button>
  </div>`;
}

function bindAdmin() {
  const key = admins()[P.id];
  document.getElementById("toggleClose").onclick = async () => {
    try { P = await api(`/polls/${P.id}/close`, { admin: key, closed: !P.closed, voter }); editing = false; renderPoll(); toast(P.closed ? "Umfrage geschlossen" : "Umfrage wieder offen"); }
    catch (err) { toast(err.message); }
  };
  document.getElementById("adminLink").onclick = async () => {
    const url = location.origin + "/umfrage/" + P.id + "#a=" + key;
    try { await navigator.clipboard.writeText(url); toast("Verwaltungs-Link kopiert"); } catch { prompt("Verwaltungs-Link:", url); }
  };
  document.getElementById("del").onclick = async () => {
    if (!(await confirmBox("Umfrage wirklich löschen? Alle Stimmen sind dann weg.", "Ja, löschen"))) return;
    try { await api(`/polls/${P.id}/delete`, { admin: key }); forgetPoll(P.id); location.href = "/umfrage"; }
    catch (err) { toast(err.message); }
  };
}
</script>
</body>
</html>
